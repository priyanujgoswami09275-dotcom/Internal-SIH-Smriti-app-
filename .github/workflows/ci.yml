name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (tests + live PG smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eldercare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/eldercare
      ENVIRONMENT: test
      ENABLE_BACKGROUND_JOBS: "false"
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Backend unit + API tests (SQLite, no DB needed)
        run: |
          python -m pytest app/tests tests -q
          python test_phase2_services.py
      - name: Apply migration on a clean Postgres
        run: alembic upgrade head
      - name: Verify models match the migrated schema, and RLS is on every table
        env:
          SCHEMA_PARITY_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/eldercare
          RLS_MIGRATION_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/eldercare
        run: |
          python -m pytest tests/test_model_schema_parity.py -q
          python -m pytest tests/test_migrations.py -q
      - name: Live E2E smoke against Postgres
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SRV=$!
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health >/dev/null || { echo "backend failed to start"; kill $SRV; exit 1; }
          python smoke_e2e.py
          RC=$?
          kill $SRV 2>/dev/null || true
          exit $RC

  frontend:
    name: Flutter (mobile + dashboard VM/Chrome + web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Mobile — deps, drift codegen, analyze
        working-directory: mobile
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter analyze
      - name: Mobile — unit and widget tests
        working-directory: mobile
        run: flutter test
      - name: Dashboard — deps, analyze, VM tests
        working-directory: dashboard
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Dashboard — Chrome-platform tests
        working-directory: dashboard
        run: flutter test --platform chrome
      - name: Dashboard — release web build
        working-directory: dashboard
        run: flutter build web --release --dart-define=API_BASE_URL=https://ci.invalid
      - name: Dashboard — release build refuses a non-public API URL
        working-directory: dashboard
        # The release guard must fail the build, not just fail at runtime, so a
        # shipped bundle can never point at localhost or cleartext http.
        run: |
          if flutter build web --release --dart-define=API_BASE_URL=http://127.0.0.1:8000; then
            echo "::error::release build accepted a loopback http API_BASE_URL"
            exit 1
          fi
          if flutter build web --release; then
            echo "::error::release build succeeded without an explicit API_BASE_URL"
            exit 1
          fi
      - name: Mobile — release build requires an explicit https API URL
        working-directory: mobile
        # The compile-time guard must reject an unset URL and a cleartext
        # emulator URL, so an APK that cannot reach a real API is never built.
        # `flutter build apk` needs a JDK on the runner (already present on
        # ubuntu-latest images).
        run: |
          flutter build apk --release --dart-define=API_BASE_URL=https://ci.invalid
          if flutter build apk --release; then
            echo "::error::release APK built without an explicit API_BASE_URL"
            exit 1
          fi
          if flutter build apk --release --dart-define=API_BASE_URL=http://10.0.2.2:8000; then
            echo "::error::release APK accepted a cleartext emulator API_BASE_URL"
            exit 1
          fi
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks@v2
        with:
          config-path: .gitleaks.toml
          args: detect --source . --verbose
